name: Keep Supabase Alive

on:
  schedule:
    # 3일마다 한 번씩 새벽 0시에 실행 (UTC 기준)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase
        run: |
          curl -i "${{ secrets.SUPABASE_URL }}/rest/v1/?apikey=${{ secrets.SUPABASE_ANON_KEY }}"
